<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wrap</title>
    <link rel="stylesheet" href="_css/wrap.css">
</head>
<body>
    <h1>página de estudos - flex wrap</h1>
    <h1>flex-wrap: nowrap;</h1>
    <section class="container nowrap">
        <!-- o nome foi grudado para definir um conteúdo que não possa ser quebrado, como uma palavra ou imagem. se fosse uma frase ele quebraria as linhas da frase -->
        <div class="item">TesteDoItem1</div>
        <div class="item">TesteDoItem2</div>
        <div class="item">TesteDoItem3</div>
    </section>
    
    <h1>flex-wrap: wrap;</h1>
    <section class="container wrap">
        <div class="item">TesteDoItem1</div>
        <div class="item">TesteDoItem2</div>
        <div class="item">TesteDoItem3</div>
    </section>
    
    <h1>flex-wrap: wrap-reverse;</h1>
    <section class="container wrap-reverse">
        <div class="item">TesteDoItem1</div>
        <div class="item">TesteDoItem2</div>
        <div class="item">TesteDoItem3</div>
    </section>
</body>
</html>
